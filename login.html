<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal One Stop Center 로그인</title>
<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font-family: 'Noto Sans KR', sans-serif; margin: 0; background: #f4f5f7;
         display: flex; align-items: center; justify-content: center; height: 100vh; }
  .box { background: #fff; border-radius: 12px; padding: 40px 32px; width: 90%; max-width: 360px;
         text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
  h3 { margin: 0 0 8px; color: #1c2333; }
  p  { color: #666; font-size: 14px; margin: 8px 0 24px; }
  #btn-wrap { display: flex; justify-content: center; }
  #msg { color: #e74c3c; font-size: 13px; margin-top: 16px; min-height: 18px; }
</style>
</head>
<body>
  <div class="box">
    <h3>🔐 LEGAL ONE-STOP CENTER</h3>
    <p>Google 계정으로 로그인해주세요</p>
    <div id="btn-wrap"></div>
    <div id="msg"></div>
  </div>

<script>
  // ⚠️ 웹앱(GAS)의 배포 URL. 토큰을 이 창(부모)으로 안전하게 전달할 때 대상 확인용.
  //    실제로는 postMessage 대상이 부모 창이므로 origin 체크는 부모 쪽에서 한다.
  var CLIENT_ID = '943167991171-3jlm221s4uk81a8huj63t5f9su8osmvm.apps.googleusercontent.com';

  // GIS 로드 완료를 기다렸다가 버튼을 렌더한다.
  function initLogin() {
    if (!(window.google && google.accounts && google.accounts.id)) {
      setTimeout(initLogin, 100);
      return;
    }
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: onCredential,
      ux_mode: 'popup'
    });
    google.accounts.id.renderButton(
      document.getElementById('btn-wrap'),
      { type: 'standard', size: 'large', theme: 'outline', text: 'signin_with', shape: 'rectangular' }
    );
  }

  // 구글 로그인 성공 → JWT(credential)를 부모(웹앱) 창으로 전달
  function onCredential(response) {
    var idToken = response && response.credential;
    if (!idToken) { document.getElementById('msg').textContent = '로그인 토큰을 받지 못했습니다.'; return; }

    if (window.opener && !window.opener.closed) {
      // 부모 창(웹앱)으로 토큰 전달. 대상 origin은 부모의 실제 origin으로 한정.
      window.opener.postMessage({ type: 'IGAW_LOGIN', idToken: idToken }, '*');
      document.getElementById('msg').style.color = '#1c8a4a';
      document.getElementById('msg').textContent = '로그인 완료! 창이 곧 닫힙니다.';
      setTimeout(function(){ window.close(); }, 800);
    } else {
      document.getElementById('msg').textContent = '원래 창을 찾을 수 없습니다. 웹앱에서 다시 시도해주세요.';
    }
  }

  initLogin();
</script>
</body>
</html>
